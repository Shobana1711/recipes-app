<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recipes API</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 3rem auto; padding: 0 1rem; color: #222; }
    code { background: #f2f2f2; padding: 2px 6px; border-radius: 4px; }
    td, th { padding: 6px 12px; border-bottom: 1px solid #ddd; text-align: left; }
    table { border-collapse: collapse; width: 100%; }
  </style>
</head>
<body>
  <h1>🍲 Recipes API</h1>
  <p>REST API built with Node.js, Express and Mongoose.</p>
  <table>
    <tr><th>Method</th><th>Endpoint</th><th>Description</th></tr>
    <tr><td>POST</td><td><code>/api/recipes</code></td><td>Create a recipe</td></tr>
    <tr><td>GET</td><td><code>/api/recipes</code></td><td>Get all recipes</td></tr>
    <tr><td>GET</td><td><code>/api/recipes/:id</code></td><td>Get recipe by ID</td></tr>
    <tr><td>PUT</td><td><code>/api/recipes/:id</code></td><td>Update recipe</td></tr>
    <tr><td>DELETE</td><td><code>/api/recipes/:id</code></td><td>Delete recipe</td></tr>
  </table>
</body>
</html>
